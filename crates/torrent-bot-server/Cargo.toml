[package]
name = "torrent-bot-server"
version = "1.1.0"
edition = "2021"

[dependencies]
actix-rt = "2.10.0"
actix-web = { version = "4.8.0", features = ["rustls"] }
tracing = "0.1.40"
tracing-actix-web = { version = "0.7.25", features = ["opentelemetry_0_33"] }
torrent-bot-clients = { version = "1.1.0", path = "../torrent-bot-clients" }
serde = { version = "1.0.203", features = ["derive"] }
futures-lite = "2.3.0"
dotenv = "0.15.0"
envy = "0.4.2"
async-trait = "0.1.81"
